version: 2

updates:
  # One npm entry covers the whole workspace: the root manifest, backend,
  # frontend and shared all resolve through the single lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tooling:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - '@vitejs/*'
          - typescript
          - eslint
          - '@eslint/*'
          - 'eslint-plugin-*'
      testing:
        patterns:
          - '@testing-library/*'
          - jsdom
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
